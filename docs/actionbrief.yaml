    figureExplanation: 'The three rules select 160,299, 212,291 and 310,810 complete source roads at 1% cost, respectively.
      Mapping uses selected road length over candidate road length within each of 318,761 road-bearing meshes; road-bearing
      cells outside the inhabited origin sample are retained. Panel d compares count-based Jaccard overlap of the
      same selected sets. A local 5% colour threshold is a display choice, not the national budget or protection
      rate. # National Spatial Allocation of Pavement Maintenance


      Panels a-c map traffic, condition and access allocations at a common 1% requested national length-relative
      budget. Colours show the selected candidate source-road length within each native 1 km mesh divided by all
      candidate source-road length in that mesh. Original source curves are clipped at mesh boundaries; their metric
      clipped lengths allocate the original source-record costs proportionally, conserving both candidate and selected
      lengths. Boundary-only segments are assigned once using half-open cells. All road-bearing meshes are included,
      even outside the inhabited origin sample. Zero selected length is blue; cells with no candidate road denominator
      are NoData. The shared map scale is linear 0-5%. Values above 5% use the maximum colour, indicated by the
      upper colourbar extension. Only colours saturate; stored maintained-length shares are unchanged. Panel d retains
      its 0-100% overlap scale. Panel d shows count-based Jaccard similarity between unique original source-road
      selected sets: intersection divided by union, displayed as percentages. It does not weight road length, population
      or benefit. The maps and matrix use the same 1% sets as the protection and residual-burden comparisons, with
      explicitly hypothetical missing traffic and condition inputs. Road locations do not identify protected residents,
      physical repair cost or observed projects. Candidate records include retained source multiplicity and parallel
      alternatives. The national budget denotes 1% of total relative source length, not 1% of road counts.'
