    figureAim: Compare three conditional national priorities across four expanded-domain budgets, with aggregate
      and fixed area-group protection and the adopted impedance comparison.
    figureExplanation: 'At 1% requested national cost, access priority protects 57.28% of aggregate reference burden
      versus 1.78% for traffic and 1.12% for condition. Its higher-ageing and distance-disadvantaged group protection
      is 10.54% and 14.05%, much lower than aggregate protection; this is a distributional limit, not universal
      equity. At 5% budget, traffic protects 15.78% overall but 16.08% in higher-ageing areas and 20.57% in distance-disadvantaged
      areas. Fixed-set impairment sensitivity does not test alternative synthetic traffic or condition inputs. #
      National Pavement Maintenance Protection Under Budget Constraints


      Panels a-c compare aggregate, higher-ageing-area and baseline-distance-disadvantaged-area protection at requested
      budgets of 1, 5, 10 and 20 percent, under a 25 percent unmaintained-road impedance increment. Panel d compares
      aggregate protection at a 1 percent budget under 10, 25 and 50 percent increments, keeping the baseline priority
      lists and selections fixed. Protection is the fraction of population-weighted excess generalized medical-access
      cost avoided relative to the same group''s all-unmaintained reference. Group denominators differ and the two
      area groups overlap. Lines connect evaluated budget points without adding intermediate evaluations. Results
      concern the replacement scenario over 21,415,800 accepted candidate source-road records on the fixed selected
      population, with source-length-relative costs, explicitly hypothetical missing traffic and condition inputs,
      and assumed finite impairment. They are not observed repair effects, travel-time savings or individual elderly
      outcomes. Nationwide candidate-road eligibility does not establish coverage of all real roads or all residents.'
