  table_baseline_analysis_sample_selection:
    tableId: table_baseline_analysis_sample_selection
    tablePath: data/results/tables/Table_baseline_analysis_sample_selection.xlsx
    tableCaption: Baseline Analysis Sample Selection
    tableAim: Account for the selected baseline population and overlapping exclusions.
    tableExplanation: 'From 176,964 baseline meshes and 126,146,099 residents, the excluded union removes 1,352
      meshes and 271,311 residents, retaining 175,612 meshes and 125,874,788 residents. Age and undefined-distance
      exclusions overlap in one mesh with one resident. Original age supports and baseline source records are preserved.
      Baseline Analysis Sample Selection


      Each count refers to observed baseline meshes; resident counts sum Local Total Population. All population
      shares use the original baseline population of 126,146,099 residents as the denominator.


      Exclusion components overlap. Subtract the age/distance overlap once when calculating the excluded union.
      The overlap is a subset, not an additional exclusion category.


      Undefined ageing share excludes all members of the affected official publication support. Undefined medical
      distance includes eligible entries without a candidate path and pending entries; pending entry is not verified
      physical disconnection.


      The retained mesh population is 125,874,788. The selected 145,771 age publication supports retain their original
      age and full-support population counts; full-support population is not the selected mesh population. No older
      residents are redistributed to member meshes.


      Candidate medical access uses registered hospitals and general clinics, not verified current service availability.
      Population and facilities refer to 2020 and the candidate road configuration to 2024.


      Missing baseline distances are not replaced by zero. Scenario-induced disconnection of an originally eligible
      origin would be a policy outcome, not a new baseline exclusion. This table describes sample coverage, not
      maintenance benefits.


      Sources: e-Stat census population and official age publication supports; MLIT National Land Numerical Information
      medical facilities and candidate road centre lines.'
    tableSuitableSection: 'Appendix A: Sample accounting; summarize coverage in main Methods'
    analysisScript: src/analyses/table_baseline_analysis_sample_selection.py
    sourceCaptionPath: data/results/tables/Table_baseline_analysis_sample_selection.caption.md
