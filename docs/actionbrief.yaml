tableDictionary:
  table_allocation_rules_and_shared_scenario_assumptions:
    tableId: table_allocation_rules_and_shared_scenario_assumptions
    tablePath: data/results/tables/Table_allocation_rules_and_shared_scenario_assumptions.xlsx
    tableCaption: Allocation Rules And Shared Scenario Assumptions
    tableAim: Make the adopted conditional bridge allocation rules and shared assumptions explicit; distinguish
      the baseline from the adopted matched-population sensitivity.
    tableExplanation: 'The ten component rows separate observations from assumed bridge-to-road links, relative
      cost, full prevention, equal single-event weights and priority rules. All 46,688 units share 15,815 measured
      traffic observations. The Notes and Detailed methods worksheets preserve the precise conditional scope and
      independent matched-population extension. Allocation Rules and Shared Scenario Assumptions


      The same units, origins, medical destinations, costs, maintenance effect and event weights apply to all three
      rules. Only priority order changes. Exact final ties use stable source-road identity.


      Traffic is measured over daytime 12 hours; 15,815 observation units are shared across 46,688 roads. Condition
      categories are ordinal. Access priority ranks medical reachability loss first, then added distance among still-reachable
      origins.


      Bridge-road linkage, area-proportional cost, complete event prevention and equal mutually exclusive event
      weights are assumptions. Protection is conditional, not annual risk, unique beneficiaries or a proved optimum.
      Unaffordable units are neither skipped nor split; report actual and unused spending.


      Area groups use original-support upper-quartile cutoffs (49.693% ageing; 3.924 km baseline medical distance),
      retaining ties. Groups overlap and describe all residents in those areas. No older residents are redistributed.
      The separate bridge demographic sensitivity uses official spatial population-change factors on matched origins
      and fixed original area groups.'
    tableSuitableSection: 'Appendix C: Independent bridge comparison'
    analysisScript: src/analyses/table_allocation_rules_and_shared_scenario_assumptions.py
    sourceCaptionPath: data/results/tables/Table_allocation_rules_and_shared_scenario_assumptions.caption.md
    artifactSha256: f66296e1ecdd532e189ad0dca060be7058c0c415cf7be1e22b590db463fd0c36
