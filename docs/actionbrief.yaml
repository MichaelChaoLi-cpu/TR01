  medical_facilities:
    datasetSourceName: Medical facilities
    datasetDescription: Registered medical destinations and candidate-network baseline accessibility. This file
      stores medical facilities.
    datasetAttribute: table
    datasetProvider: MLIT National Land Numerical Information and Statistics Bureau of Japan, e-Stat; candidate-network
      construction by TR01.
    datasetGenerationInfo: 'Source-preserving preprocessing or explicit deterministic scenario construction. Technical
      upstream source: data/exp/national-population-entry/point_attachment_diagnostics.csv.'
    datasetPeriod: 'Population and medical registration: 2020; candidate road configuration: September 2024.'
    datasetScale: Japan-wide source coverage; 181,312 stored rows and 10 columns. File row counts are records, not
      independent measurements or beneficiary totals.
    datasetSpatialResolution: Medical point locators, native population meshes and official age publication supports.
    datasetTemporalResolution: One cross-sectional candidate configuration with different input reference years.
    datasetPreprocessingInfo: Hospitals and general clinics are destination categories 1 and 2; dental and unresolved-entry
      facilities are retained but not included destinations. Baseline distances remain missing for no path/pending
      entries; support means are conditional on finite-path population.
    processedPath: data/processed/medical-baseline/medical_facilities_preprocessed.parquet
    upstreamSource: data/exp/national-population-entry/point_attachment_diagnostics.csv
    preprocessingScript: src/preprocessing/preprocess_medical_facilities.py
    lineageRecord: data/exp/data-preprocessing/medical-baseline/decisions.json
    storedRecordCount: 181312
    storageSchema:
      Medical Facility ID: large_string
      Source Dataset: large_string
      Medical Facility Category: large_string
      Medical Facility Name: large_string
      Medical Facility Source Record: large_string
      Longitude: double
      Latitude: double
      Candidate Road Entry Eligible: bool
      Selected Medical Destination: bool
      Included Medical Network Destination: bool
