analysisStructureBrief:
  overview: Applied conditional pavement-maintenance allocation in Japan, directed at one central question and four
    supporting questions. The main model uses all 21,415,800 accepted candidate source-road records and fixed original
    population. Appendix A documents baseline inputs/coverage; Appendix B retains the 70,049-road observed pavement
    experiment; Appendix C retains independent 46,688-unit bridge allocation and matched-origin population sensitivity.
    There is no joint pavement/bridge budget, future-population pavement model, causal ageing/repair effect or observed
    economic/fiscal trajectory. Existing engineering validation and human output acceptance support reproducibility/presentation
    within the adopted assumptions; they do not establish external empirical validity or journal novelty.
  levels:
  - levelName: Baseline sample and candidate medical access
    levelAim: Locate baseline disadvantage and document coverage for Supporting Point 1.
    inputs:
    - Local Total Population
    - Candidate Medical Network Distance
    - Population Aged 65+ Share Among Known Ages
    - Population-Weighted Candidate Medical Network Distance
    - Population Share With Candidate Medical Path
    - Population Share Without Candidate Medical Path
    - Population Share With Pending Road Entry
    modelOrMethod: Select meshes with finite medical distance and a defined original support ageing share; select
      supports with defined ageing and weighted distance. Preserve complete input baselines and count overlapping
      exclusions by their union. Support distance is \[D_g=\frac{\sum_{m\in G_g:F_m=1}P_m d_m}{\sum_{m\in G_g}P_m
      F_m}.\] Here \(G_g\) is the complete official support, \(P_m\) original local population, \(d_m\) candidate
      network distance and \(F_m\) finite-path status. Display selected distance as \(d_m/1000\) kilometres in native
      meshes. Divide category resident counts by original baseline population for sample shares.
    outputs:
    - National Candidate Medical Distance
    - Analysis Sample Coverage
    - Baseline Analysis Sample Selection
    interpretation: Existing population and path statuses determine the selected sample and conditional support
      means. Retained population is 125,874,788 on 175,612 meshes; the excluded union has 271,311 residents. Evidence
      supports spatial baseline accounting within the candidate metric. Historical registration, undirected routing
      and missing legal/time rules limit service interpretation; individual elderly access and maintenance effects
      are not identified.
  - levelName: Population intensity and demographic association
    levelAim: Describe age/intensity associations with access on compatible official supports.
    inputs:
    - Support Total Population
    - Population Density
    - Population Aged 65+ Share Among Known Ages
    - Population-Weighted Candidate Medical Network Distance
    modelOrMethod: Full-support density is \(\rho_g=N_g/\sum_{m\in G_g}a_m\), with \(N_g\) support population and
      \(a_m\) complete ellipsoidal mesh area including water. On 145,771 selected supports, fit \[z_g=\alpha_j+\beta_j
      x_g^{(j)}+\epsilon_{gj},\quad z_g=\sqrt{D_g/1000}.\] Here \(j\) denotes two panels, \(x_g^{(a)}=100S_g\) is
      percentage known-age ageing, \(x_g^{(b)}=\log_{10}\rho_g\) is log10 density, and \(\alpha_j,\beta_j,\epsilon_{gj}\)
      are intercept, slope and residual. Compute unweighted OLS and Pearson correlation on original supports, with
      \(R_j^2=r_j^2\). Count each support once in display-coordinate hexagons; fit straight lines in those same
      coordinates.
    outputs:
    - Ageing, Population Concentration and Candidate Medical Access
    interpretation: Descriptive Pearson r is +0.367703 for ageing and −0.721186 for log10 density, against square-root
      medical distance. This supports associations in the selected supports, with separate original full-population
      and finite-path denominators. It does not identify causal demographic effects, clustering, individual elderly
      travel or spatial-independence significance.
  - levelName: Local input illustration
    levelAim: Make the origin, network and destination construction understandable.
    inputs:
    - Local Total Population
    - Candidate Medical Network Distance
    modelOrMethod: 'Draw four panels: national Kyoto locator, published population on native meshes, accepted original
      road curves, and included registered hospitals/general clinics over the same local population/roads. Keep
      the three local extents identical; use a separate locator scale. Retain source counts, curves and facility
      coordinates; no interpolation or new routing.'
    outputs:
    - Population Roads and Medical Destinations
    interpretation: The Kyoto window visually explains inputs, containing 907 published meshes and 1,489,760 residents.
      It is illustrative and does not support national representativeness, a new analytical sample or a maintenance
      effect. Medical locator/category fields are technical inputs rather than newly introduced scientific outcomes.
  - levelName: Conditional road dependence and observed demand
    levelAim: Evaluate Supporting Point 2 on the bounded observed-traffic comparison.
    inputs:
    - Local Total Population
    - Candidate Medical Network Distance
    - Observed Traffic Volume
    - Lost Medical Path Population
    - Additional Medical Distance Burden
    modelOrMethod: Remove each original source road independently, disabling fixed origin/destination entries requiring
      it while retaining parallel alternatives. \[L_e=\sum_{m\in M}P_m(1-I_{me}),\quad T_e=\frac{1}{1000}\sum_{m\in
      M:I_{me}=1}P_m(d_m^{(-e)}-d_m).\] Here \(M\) is the fixed selected origin set, \(e\) one source-road event,
      \(I_{me}\) finite-path status after that event, \(L_e\) lost-path residents and \(T_e\) additional person-kilometres
      among reachable origins. Compare measured traffic only on the strict accepted correspondence; map original
      road curves and retain zero burdens.
    outputs:
    - Road Service Dependence and Measured Traffic
    interpretation: National loss computation covers 21,415,800 roads; the plotted measured comparison covers 1,183,367
      roads sharing 25,566 measurements. Positive path loss can be confined to the closed origin entry and is not
      automatically geographic isolation. Evidence is bounded dependence/demand context, not a pavement impairment
      effect, annual risk, causal repair benefit or universal all-road traffic finding.
  - levelName: Complete national scenario inputs
    levelAim: Define a common national decision domain while preserving observed-input gaps.
    inputs:
    - Graph Source Edge ID
    - Baseline Source Road Length
    - Road Classification Code
    - Road Width Code
    - Observed Traffic Volume
    - Anchored Pavement Inspection Category
    - Scenario Traffic Volume
    - Scenario Pavement Need Category
    - Scenario Traffic Basis
    - Scenario Condition Basis
    - Scenario Relative Maintenance Cost
    - Scenario Priority Tie Key
    modelOrMethod: All 21,415,800 accepted source roads are deterioration-eligible and maintainable. Preserve original
      missing measured inputs. Construct separately labelled class/width traffic medians with at least 30 measurement
      units and documented fallbacks; municipal/other values use 10% of the prefectural reference. Missing need
      grades use adopted observed-category probabilities with seed 20261007. Relative cost is original source length;
      independent tie keys use seed 20261008. Input coverage is not immunity from deterioration.
    outputs:
    - National Pavement Maintenance Protection Under Budget Constraints
    - National Distribution of Residual Pavement Access Burden
    - National Spatial Allocation of Pavement Maintenance
    - National Pavement Maintenance Protection and Resource Accounting
    interpretation: Existing class/width inputs and adopted assignments establish a reproducible conditional domain.
      Only 1,183,367 roads have observed traffic and 70,049 have anchored grades; remaining scenario values are
      assumptions. Evidence supports traceability and common-domain comparability, not empirical prediction of missing
      road traffic/condition or unique physical national mileage.
  - levelName: National ranking and affordable prefixes
    levelAim: Compare common national priority lists and resource allocations.
    inputs:
    - Scenario Traffic Volume
    - Scenario Pavement Need Category
    - Scenario Relative Maintenance Cost
    - Scenario Priority Tie Key
    - Pavement Isolated Restoration Gain
    - Pavement Access Priority Score
    - Pavement Budget Share
    - Pavement Maintenance Selected
    modelOrMethod: For national roads, \[s_{e,T}=v_e,\quad s_{e,C}=h_e,\quad s_{e,A}=g_e/\ell_e.\] Here \(v_e\)
      is Scenario Traffic Volume, \(h_e\) ordinal need category, \(g_e\) isolated restoration gain computed from
      the all-road 25% reference and \(\ell_e\) source-length relative cost. Descending primary scores, ascending
      common tie key and then source ID define each complete list. At \(b\in\{0.01,0.05,0.10,0.20\}\), select the
      longest prefix whose summed source-length cost is at most \(b\sum_e\ell_e\); no splitting or skipping. Report
      actual and unused cost and selected count. Keep lists/selections fixed across increments.
    outputs:
    - National Pavement Maintenance Protection Under Budget Constraints
    - National Pavement Maintenance Protection and Resource Accounting
    - National Spatial Allocation of Pavement Maintenance
    interpretation: Only ordering changes between rules on a common cost denominator. At 1% requested cost, selected
      road counts are 160,299, 212,291 and 310,810 for traffic, condition and access. Costs are relative source
      lengths, not monetary budgets or counts. Isolated restoration gains define a fixed heuristic list, not additive
      joint benefits or a proved optimum.
  - levelName: National joint protection and distribution
    levelAim: Answer the central question and Supporting Points 3–4 within the adopted pavement contract.
    inputs:
    - Local Total Population
    - Candidate Medical Network Distance
    - Pavement Effective Road Cost
    - Pavement Impedance Increment
    - Pavement Population Group
    - Pavement Reference Access Burden
    - Pavement Residual Access Burden
    - Pavement Avoided Access Burden
    - Pavement Access Protection Share
    - Higher Ageing Area
    - Baseline Distance Disadvantaged Area
    modelOrMethod: 'In the main domain all source roads are eligible: \[\widetilde\ell_e=\ell_e[1+\delta(1-x_e)],\quad
      H_S(\mathbf{x},\delta)=\frac{1}{1000}\sum_{m\in S}P_m[\widetilde d_m(\mathbf{x},\delta)-d_m],\quad Q_S=\frac{H_S(\mathbf{0},\delta)-H_S(\mathbf{x},\delta)}{H_S(\mathbf{0},\delta)}.\]
      Here \(x_e\) is selection, \(\delta\) the impairment increment, \(S\) all residents or a fixed original area
      group, \(\widetilde d_m\) recomputed shortest generalized medical cost and \(d_m,P_m\) original baseline distance/population.
      Scale partial origin, destination and same-road legs consistently and retain parallel minima. Evaluate 36
      policies and three references jointly; undefined zero-reference fractions remain missing. Map native contributions
      \(P_m[\widetilde d_m-d_m]/1000\).'
    outputs:
    - National Pavement Maintenance Protection Under Budget Constraints
    - National Distribution of Residual Pavement Access Burden
    - National Pavement Maintenance Protection and Resource Accounting
    interpretation: At 1% cost, access protects 57.28% of aggregate reference burden but only 10.54% and 14.05%
      in the fixed ageing/distance groups; traffic and condition protect 1.78% and 1.12% overall. This supports
      a conditional allocation contrast and uneven distribution. Objective alignment is deliberate; results do not
      prove equity, an optimal portfolio, actual extra journeys, causal repair effects or future-population pavement
      protection. Each overlapping group has its own denominator. Fixed-set 10/25/50% sensitivity tests only the
      impairment parameter.
  - levelName: National allocation geography and overlap
    levelAim: Locate resources separately from population burden and compare selected sets.
    inputs:
    - Graph Source Edge ID
    - Baseline Source Road Length
    - Pavement Maintenance Selected
    - Pavement Maintenance Priority
    - Pavement Budget Share
    - Mesh Maintained Road Length Share
    - Pavement Rule Selection Overlap
    modelOrMethod: Clip original curves to native mesh cells and proportionally allocate each original metric length.
      For road-bearing cell \(m\), display \(u_m=\sum_e x_e\ell_{em}/\sum_e\ell_{em}\), where \(\ell_{em}\) is the
      conserved source-length contribution in that cell. Retain all 318,761 road-bearing meshes, valid zero selected
      length and NoData for no road denominator. For selected sets \(A_r,A_s\), compare \(J_{rs}=|A_r\cap A_s|/|A_r\cup
      A_s|\). Use the same national 1% sets as protection; empty union is undefined.
    outputs:
    - National Spatial Allocation of Pavement Maintenance
    interpretation: Lengths conserve candidate and selected costs, and all nine count-based overlaps reproduce intersections/unions.
      This supports allocation geography and rule similarity; it does not locate beneficiaries or imply that high
      selection overlap guarantees equal access outcomes. Map colours saturate at 5%, matrix colours at 100%, without
      clipping stored values.
  - levelName: Independent observed-pavement comparison
    levelAim: Assess the same policy contrast on the restricted observed domain in Appendix B.
    inputs:
    - Observed Traffic Volume
    - Anchored Pavement Inspection Category
    - Pavement Relative Maintenance Cost
    - Pavement Traffic Priority Score
    - Pavement Isolated Restoration Gain
    - Pavement Access Priority Score
    - Pavement Budget Share
    - Pavement Impedance Increment
    - Pavement Access Protection Share
    modelOrMethod: 'Restrict eligible deterioration/maintenance set \(E_P\) to 70,049 adopted observed common roads,
      while retaining the full routing network: \(\widetilde\ell_e=\ell_e[1+\delta\mathbf{1}\{e\in E_P\}(1-x_e)]\).
      Other roads remain at baseline. Reuse joint burden/protection formulas with this domain\''s own references
      and length-cost denominator. Traffic ranks measured volume/length, condition III/II/I then lower cost, access
      isolated 25% restoration gain/length; original road ID resolves final ties. Use four complete-prefix budgets
      and three fixed-set increments.'
    outputs:
    - Pavement Maintenance Protection Under Budget Constraints
    - Spatial Distribution of Residual Pavement Access Burden
    - Pavement Maintenance Protection and Resource Accounting
    interpretation: This independent observed-domain experiment supports a bounded rule contrast, with 25.66% aggregate
      access protection at 1% versus approximately 1.25% for either alternative. Its reference burden is 305,716.86
      resident reference-km; 160,326 meshes have zero increase because outside roads remain unimpaired. It is not
      all-road deterioration or direct validation of main-national effect sizes; matching, cost and effects remain
      conditional. No missing observed input is imputed in this supplement.
  - levelName: Independent bridge allocation
    levelAim: Compare bridge-specific conditional single-event protection in Appendix C.
    inputs:
    - Bridge Length
    - Bridge Width
    - Bridge Inspection Category
    - Observed Traffic Volume
    - Relative Intervention Cost
    - Maintenance Intervention Effect
    - Conditional Event Weight
    - Maintenance Priority
    - Budget Share
    - Lost Medical Path Population
    - Additional Medical Distance Burden
    - Higher Ageing Lost Medical Path Population
    - Distance Disadvantaged Lost Medical Path Population
    modelOrMethod: For 46,688 conditional units, \(c_e=\ell_e w_e\) uses bridge dimensions, independently of pavement
      source length. Rank traffic/cost, category IV/III/II/I then lower cost, or lost-path residents/cost then finite-route
      burden/cost; stable source identity resolves ties. Select longest affordable prefixes for \(b\sum_ec_e\).
      Under full prevention of equally weighted mutually exclusive single events, \[Q_{r,o,h}(b)=\frac{\sum_e x_{er}(b)Y_{e,o,h}}{\sum_eY_{e,o,h}},\quad
      o\in\{L,T\}.\] Here \(r\) is a rule, \(o\) reachability or finite-distance loss, \(h\) all residents or a
      fixed origin group, and \(Y\) its per-event loss. Uniform event weights cancel. Average avoided loss per event
      divides selected loss sums by 46,688.
    outputs:
    - Common-Budget Maintenance Protection and Distribution
    - Allocation Rules and Shared Scenario Assumptions
    - Protection by Maintenance Rule and Population Group
    interpretation: At 1% bridge cost, access protects 99.82% of conditional lost-path population but 7.13% of additional
      finite-route burden, spending 0.9448146% of total area-relative cost. Outcome definitions differ from pavement
      joint burden. Evidence supports conditional bridge prioritization, not annual risk, physical verified bridge
      repairs, unique beneficiaries, monetary benefits or universal equity. Bridge budgets and event outcomes remain
      independent of pavement.
  - levelName: Independent bridge population sensitivity
    levelAim: Evaluate the bridge-specific demographic component of Supporting Point 4.
    inputs:
    - Forecast Matched Origin
    - Forecast Reference Population
    - Projected Total Population
    - Population Change Factor
    - Scenario Population
    - Population-Change Scenario
    - Ageing Scenario
    - Budget Share
    - Priority Stability
    - Distribution of Protected Access
    modelOrMethod: On 175,485 matched origins, \[p_{mt}^{*}=P_m\frac{F_{mt}}{F_{m0}},\quad J_t(b)=\frac{|A_t(b)\cap
      A_0(b)|}{|A_t(b)\cup A_0(b)|}.\] Here \(F_{mt}\) is the summed official municipality-component mesh population,
      \(F_{m0}\) its 2020 reference, \(p_{mt}^{*}\) census-anchored scenario weights and \(A_t\) access-priority
      selected units under the original bridge prefix/cost rule. Reweight original road-specific path changes for
      2020/2030/2040/2050; freeze original area groups, network, destinations, units and costs. Rerank access only.
      Compute Jaccard at four budgets and scenario-specific selected/total reachability loss at 1%; missing unmatched
      forecasts remain missing and genuine projected zeros stay zero.
    outputs:
    - Priority Stability Under Budget and Demographic Scenarios
    - Reachability Protection Under Demographic Scenarios
    interpretation: Matched 2020 has 125,874,510 original residents; 127 unmatched origins and 278 residents are
      excluded only from this comparison. Jaccard measures selected-set change, while protection has a changing
      scenario loss denominator. Aggregate access protection rises from 99.82% to 99.95% by 2050, without establishing
      increasing absolute protected residents. Evidence supports bounded bridge sensitivity, not future pavement
      priorities, future elderly locations, observed population trends or future traffic.
  - levelName: Bridge population selection geography
    levelAim: Locate changes in already computed bridge selected sets.
    inputs:
    - Population-Change Scenario
    - Budget Share
    - Maintenance Priority
    - Priority Stability
    modelOrMethod: At a fixed requested 1% bridge cost, partition the two-year union into retained \(A_t\cap A_0\),
      exiting \(A_0\setminus A_t\) and new \(A_t\setminus A_0\) units. Reuse the matched-population access rankings
      and original source-road curves, common geographic views and mutually exclusive display classes. Reconcile
      membership counts to stored Jaccard intersection/union and affordable prefix costs.
    outputs:
    - Spatial Changes in Access-Priority Maintenance Selection
    interpretation: Selections decline from 1,527 units at matched 2020 to 1,119 at 2050, retaining 1,115 reference
      units, exiting 412 and adding four. This supports spatial accounting of the same conditional scenario; it
      adds no model. Source-road location is not a beneficiary location or verified bridge footprint. Exiting a
      budget prefix does not imply disappearance or absence of need.
