  national_pavement_inputs:
    datasetSourceName: National pavement inputs
    datasetDescription: Complete national pavement scenario inputs with observed and hypothetical values separated.
      This file stores national pavement inputs.
    datasetAttribute: table
    datasetProvider: TR01 research team using MLIT candidate road classifications/widths, measured traffic and anchored
      pavement grades.
    datasetGenerationInfo: 'Source-preserving preprocessing or explicit deterministic scenario construction. Technical
      upstream source: data/exp/data-preprocessing/national-pavement-inputs/national_pavement_inputs.parquet.'
    datasetPeriod: 2021 traffic and heterogeneous latest inspection inputs on September 2024 roads; fixed 2020 population
      used downstream.
    datasetScale: Japan-wide source coverage; 21,415,800 stored rows and 16 columns. File row counts are records,
      not independent measurements or beneficiary totals.
    datasetSpatialResolution: All 21,415,800 accepted candidate source-road records, including original source multiplicity.
    datasetTemporalResolution: Fixed scenario inputs; not an observed deterioration panel.
    datasetPreprocessingInfo: Preserve 1,183,367 measured traffic values and 70,049 anchored grades. Missing traffic
      uses adopted class/width references with at least 30 observation units and fallbacks; municipal/other-road
      traffic uses 10% of the prefectural reference. Missing grades use documented probabilities and seed 20261007.
      Original observed fields stay missing; an independent seed-20261008 tie key is shared across rules.
    processedPath: data/processed/national-pavement-inputs/national_pavement_inputs_preprocessed.parquet
    upstreamSource: data/exp/data-preprocessing/national-pavement-inputs/national_pavement_inputs.parquet
    preprocessingScript: src/preprocessing/preprocess_national_pavement_inputs.py
    lineageRecord: data/exp/data-preprocessing/national-pavement-inputs/decisions.json
    storedRecordCount: 21415800
    storageSchema:
      Graph Source Edge ID: int64
      Baseline Source Road Length: double
      Road Classification Code: uint8
      Road Width Code: uint8
      Observed Traffic Volume: double
      Anchored Pavement Inspection Category: int8
      Scenario Traffic Volume: double
      Scenario Pavement Need Category: uint8
      Scenario Traffic Basis: dictionary<values=string, indices=int8, ordered=0>
      Scenario Condition Basis: dictionary<values=string, indices=int8, ordered=0>
      Scenario Traffic Calibration Stratum: dictionary<values=string, indices=int8, ordered=0>
      Scenario Condition Calibration Stratum: dictionary<values=string, indices=int8, ordered=0>
      Scenario Deterioration Eligible: bool
      Scenario Maintenance Eligible: bool
      Scenario Relative Maintenance Cost: double
      Scenario Priority Tie Key: double
  national_pavement_rankings:
    datasetSourceName: National pavement rankings
    datasetDescription: Main national rankings, maintenance selections and joint finite-cost policy outcomes. This
      file stores national pavement rankings.
    datasetAttribute: table
    datasetProvider: TR01 research team using separately labelled national scenario inputs and the fixed medical
      baseline.
    datasetGenerationInfo: 'Source-preserving preprocessing or explicit deterministic scenario construction. Technical
      upstream source: data/exp/national-pavement-policy-computation/national_pavement_rankings.parquet.'
    datasetPeriod: Fixed 2020 population/medical registration, 2021 measured traffic and September 2024 roads; heterogeneous
      inspections and hypothetical missing-input assignments.
    datasetScale: Japan-wide source coverage; 64,247,400 stored rows and 8 columns. File row counts are records,
      not independent measurements or beneficiary totals.
    datasetSpatialResolution: 21,415,800 intervention source roads; 175,612 origins and 125,874,788 residents; original
      area groups.
    datasetTemporalResolution: Four requested budgets and three impairment settings; no future-population pavement
      calculation.
    datasetPreprocessingInfo: Traffic ranks Scenario Traffic Volume, condition III/II/I, and access exact isolated
      restoration gain/length. Common independent tie key and source identity define fixed lists. Longest affordable
      complete prefixes are evaluated jointly under 10%, 25%, 50% increments. Costs, budgets and group reference
      denominators are national; no observed-sample results are transplanted.
    processedPath: data/processed/national-pavement-policy/national_pavement_rankings_preprocessed.parquet
    upstreamSource: data/exp/national-pavement-policy-computation/national_pavement_rankings.parquet
    preprocessingScript: src/preprocessing/preprocess_national_pavement_rankings.py
    lineageRecord: data/exp/data-preprocessing/national-pavement-policy/decisions.json
    storedRecordCount: 64247400
    storageSchema:
      Graph Source Edge ID: int64
      Pavement Maintenance Priority: large_string
      Pavement Impedance Increment: double
      Pavement Priority Rank: int64
      Pavement Traffic Priority Score: double
      Pavement Isolated Restoration Gain: double
      Pavement Access Priority Score: double
      Pavement Relative Maintenance Cost: double
