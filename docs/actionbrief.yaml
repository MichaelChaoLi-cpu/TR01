  population_density:
    datasetSourceName: Population density
    datasetDescription: Population intensity on complete original publication-support footprints. This file stores
      population density.
    datasetAttribute: table
    datasetProvider: TR01 research team using the 2020 e-Stat census and native geographic mesh definitions.
    datasetGenerationInfo: 'Source-preserving preprocessing or explicit deterministic scenario construction. Technical
      upstream source: data/processed/population-density/population_density_constructed.parquet.'
    datasetPeriod: 2020 census.
    datasetScale: Japan-wide source coverage; 146,540 stored rows and 5 columns. File row counts are records, not
      independent measurements or beneficiary totals.
    datasetSpatialResolution: 146,540 official publication supports; all complete member-mesh footprints, including
      water.
    datasetTemporalResolution: Fixed cross-sectional baseline.
    datasetPreprocessingInfo: Divide original full-support population by summed ellipsoidal complete mesh areas;
      no land clipping, age redistribution, tail trimming or stored logarithmic transformation.
    processedPath: data/processed/population-density/population_density_preprocessed.parquet
    upstreamSource: data/processed/population-density/population_density_constructed.parquet
    preprocessingScript: src/preprocessing/preprocess_population_density.py
    lineageRecord: data/exp/data-preprocessing/population-density/decisions.json
    storedRecordCount: 146540
    storageSchema:
      Publication Support Code: large_string
      Member Mesh Count: int64
      Support Total Population: int64
      Support Footprint Area: double
      Population Density: double
  conditional_bridge_inventory:
    datasetSourceName: Conditional bridge inventory
    datasetDescription: Independent bridge allocation inputs, fixed area groups, conditional event losses and policy
      outcomes. This file stores conditional bridge inventory.
    datasetAttribute: table
    datasetProvider: TR01 research team using MLIT xROAD bridge inventory, measured road traffic, candidate roads
      and e-Stat population.
    datasetGenerationInfo: 'Source-preserving preprocessing or explicit deterministic scenario construction. Technical
      upstream source: data/exp/data-preprocessing/common-budget/bridge_policy_inventory_construction.parquet.'
    datasetPeriod: Latest heterogeneous bridge inspection records acquired in October 2026; 2021 traffic, 2020 population/medical
      register and September 2024 roads.
    datasetScale: Japan-wide source coverage; 730,844 stored rows and 15 columns. File row counts are records, not
      independent measurements or beneficiary totals.
    datasetSpatialResolution: 730,844 retained inventory assets; policy domain 46,688 conditional one-bridge/one-road
      units. Support/mesh group files use original selected population supports.
    datasetTemporalResolution: Latest-record snapshot and hypothetical mutually exclusive single-road events; budget
      grid 0–100% in one-percentage-point steps.
    datasetPreprocessingInfo: Adopt unique nearby anchors within 50 m with the confirmed conflict and shared-road
      exclusions; use observed categories/dimensions/traffic, bridge-area relative costs, full prevention, equal
      event weights and fixed affordable prefixes. Group labels retain original support definitions; bridges have
      an independent budget.
    processedPath: data/processed/common-budget/conditional_bridge_inventory_preprocessed.parquet
    upstreamSource: data/exp/data-preprocessing/common-budget/bridge_policy_inventory_construction.parquet
    preprocessingScript: src/preprocessing/preprocess_conditional_bridge_inventory.py
    lineageRecord: data/exp/data-preprocessing/common-budget/decisions.json
    storedRecordCount: 730844
    storageSchema:
      Bridge Record ID: large_string
      Source Prefecture: large_string
      Candidate Road Source Record: large_string
      Bridge Inspection Year: large_string
      Bridge Inspection Category: large_string
      Bridge Length: large_string
      Bridge Width: large_string
      Bridge Anchor Separation: large_string
      Source Road Length: large_string
      Source Road Class: large_string
      Bridge Candidate Review Flags: large_string
      Bridge Source Quality Flags: large_string
