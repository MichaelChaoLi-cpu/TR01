    tableId: table_national_pavement_maintenance_protection_and_resource_accounting
    tablePath: data/results/tables/Table_national_pavement_maintenance_protection_and_resource_accounting.xlsx
    tableCaption: National Pavement Maintenance Protection And Resource Accounting
    tableAim: Compare protection and spending on the replacement national maintainable domain under the 25% baseline
      increment.
    tableExplanation: 'Twelve rows give unrounded spending and burden outcomes for three rules at four budgets.
      At 1%, access avoids 12,151,790.12 resident reference-km and protects 57.28% overall, but 10.54% and 14.05%
      in the two fixed groups. At 20%, it reaches essentially full protection in this scenario; traffic and condition
      protect 51.23% and 22.08% overall. These results are conditional on hypothetical missing inputs and uniform
      impairment, not observed repair effects or an optimized solution. # National Pavement Maintenance Protection
      and Resource Accounting


      Three fixed maintenance rules are evaluated at requested budgets of 1, 5, 10 and 20 percent of total pavement-domain
      length-relative cost, under the 25 percent baseline impedance increment. Actual and unused spending refer
      to the same total cost denominator and reflect indivisible complete-prefix selection. Protection fractions
      compare avoided excess generalized medical-access burden with each group''s all-unmaintained reference; group
      denominators differ and groups overlap. Avoided burden uses resident reference-kilometre equivalents. Results
      concern all 21,415,800 accepted candidate source-road records, with separately labelled hypothetical missing
      traffic and condition inputs and adopted finite-cost assumptions, not observed expenditure, actual journeys,
      individual older residents or causal repair effects. Full numeric precision is retained in the workbook, with
      notes on the second sheet.'
    tableSuitableSection: 'Main manuscript: Results'
    analysisScript: src/analyses/table_national_pavement_maintenance_protection_and_resource_accounting.py
    sourceCaptionPath: data/results/tables/Table_national_pavement_maintenance_protection_and_resource_accounting.caption.md
