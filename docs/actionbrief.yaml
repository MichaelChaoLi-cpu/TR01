    figureExplanation: 'The national 25% reference sums to 21,216,259.39 resident reference-km. At 1%, residual
      burdens are 20,839,167.06 for traffic, 20,977,671.06 for condition and 9,064,469.27 for access. The native
      mesh maps locate contributions to these same totals, with linear 0–1000 colour saturation. They do not locate
      selected roads or identify the number of distinct protected residents. # National Distribution of Residual
      Pavement Access Burden


      Panel a shows the all-unmaintained eligible reference; panels b-d show traffic, condition and access priorities
      at a 1 percent requested pavement budget and 25 percent impedance increment. Each original census mesh contributes
      B = P times Delta / 1000 to the confirmed residual burden, where P is Local Total Population and Delta is
      excess generalized shortest medical-access cost in reference metres. B is in resident reference-kilometre
      equivalents. Mesh contributions sum to the corresponding All Residents residual burden used in the policy
      outcomes. The original mesh footprint has one mesh per raster pixel with no interpolation. All panels use
      the same extent, island views and linear display scale from 0 to 1000 resident reference-kilometre equivalents;
      zero is blue. Burdens above 1000 use the maximum colour, indicated by the colourbar upper extension. Colour
      saturation applies only to the display; population weights, raw burden values and policy outcomes are unchanged.
      Unobserved or excluded meshes are NoData. The maps show remaining population-weighted access burden, not selected
      roads, observed travel time or distinct beneficiaries. The full routing network is retained, while all 21,415,800
      candidate source-road records receive the adopted impairment/restoration assumptions. Missing traffic and
      condition inputs use the explicitly hypothetical class/width constructions. These values are not new observations.
      Original selected population and physical road entries remain fixed.'
