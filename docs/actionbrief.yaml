    figurePath: data/results/figures/Figure_national_pavement_maintenance_protection_under_budget_constraints.png
    figureCaption: National Pavement Maintenance Protection Under Budget Constraints
    figurePanelCount: 4
    figureNote: >-
      (a-c) Protection for all selected residents, higher-aging areas and
      baseline-distance-disadvantaged areas at requested budgets of 1%, 5%, 10% and 20%, under
      the 25% unmaintained-road impedance increment; (d) aggregate protection at a 1% budget
      under 10%, 25% and 50% increments. Panel d keeps the 25% priority lists and selections
      fixed. Protection divides avoided excess generalized medical-access burden by the same
      group all-unmaintained reference. Area groups overlap and have separate denominators.
      Lines connect evaluated budgets only. The national scenario covers 21,415,800 accepted
      source-road records, using source-length-relative costs and explicitly hypothetical
