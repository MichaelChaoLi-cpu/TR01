datasetDictionary:
  t001140:
    datasetSourceName: 2020 census mesh total population and broad age counts (T001140)
    datasetDescription: Official census mesh records and publication-support accounting. This file stores 2020 census
      mesh total population and broad age counts (t001140).
    datasetAttribute: table
    datasetProvider: Statistics Bureau of Japan, e-Stat; support construction by the TR01 research team.
    datasetGenerationInfo: 'Source-preserving preprocessing or explicit deterministic scenario construction. Technical
      upstream source: data/raw/population/census_2020_1km_jgd2011/T001140.'
    datasetPeriod: 2020 population census.
    datasetScale: Japan-wide source coverage; 176,964 stored rows and 7 columns. File row counts are records, not
      independent measurements or beneficiary totals.
    datasetSpatialResolution: Native JIS third-level geographic meshes (nominal 1 km); age counts retain official
      singleton or suppression/recipient publication supports.
    datasetTemporalResolution: Cross-sectional census; no observed longitudinal panel.
    datasetPreprocessingInfo: Source strings and suppression links are retained; derived age supports sum reciprocal
      member populations and use known-age counts without locating older residents within a support.
    processedPath: data/processed/population/T001140_preprocessed.parquet
    upstreamSource: data/raw/population/census_2020_1km_jgd2011/T001140
    preprocessingScript: src/preprocessing/preprocess_t001140.py
    lineageRecord: data/exp/data-preprocessing/decisions.json
    storedRecordCount: 176964
    storageSchema:
      Mesh Code: large_string
      Suppression Status: large_string
      Aggregation Recipient Mesh: large_string
      Contributing Suppressed Meshes: large_string
      Local Total Population: large_string
      Published Population Aged 65+: large_string
      Published Population Aged 75+: large_string
