  fig_common_budget_maintenance_protection_and_distribution:
    figureId: fig_common_budget_maintenance_protection_and_distribution
    figurePath: data/results/figures/Figure_common_budget_maintenance_protection_and_distribution.png
    figureCaption: Common Budget Maintenance Protection And Distribution
    figurePanelCount: 3
    figureNote: >-
      (a) Additional finite-route medical-distance burden avoided; (b) lost-medical-path
      population protected; (c) reachability protection within higher-aging and
      longer-baseline-distance areas. The lower-right layout cell contains legends and sample
      notes, not a fourth analytical panel. Colors identify traffic, condition and access
      priorities; solid and dashed lines distinguish the two overlapping area groups in panel
      c. Curves connect evaluations at one-percentage-point budget intervals. Budgets use
      summed bridge-length-times-width relative cost across 46,688 conditional units;
      complete-prefix selection can leave unused resources. Selecting a unit fully prevents
      its own equally weighted, mutually exclusive single-road event. Reachability and
      finite-route burden have separate loss denominators. Protection is conditional on
      assumed bridge-road associations and intervention effects, not annual risk, unique
      beneficiaries, pavement outcomes or proven optimality.
    figureAim: 'Compare three adopted priority lists on the conditional common bridge-associated road domain: aggregate
      finite-route protection, reachability protection and area-group reachability protection against requested
      relative budget.'
    figureExplanation: 'At 1% bridge-area cost, access protects 99.82% of conditional lost-path population but only
      7.13% of additional finite-route burden. At 2% and higher evaluated budgets, its two group-reachability curves
      coincide. These are separate event-loss denominators; near-complete reachability protection does not mean
      nearly all Japanese residents are protected. # Common-Budget Maintenance Protection and Distribution


      Conditional maintenance protection under common requested relative budgets. The two-by-two layout places panel
      a at the upper left, panel b at the upper right and panel c at the lower left; the lower-right cell contains
      legends and sample notes, without adding another analytical panel. Panel a shows the share of additional finite-route
      medical distance burden avoided; panel b shows the share of lost-path population protected; panel c shows
      group-specific shares of lost-path population protected. Colours identify traffic, condition and access priorities.
      Solid and dashed curves in panel c identify higher-ageing and longer-baseline-distance areas; the access-group
      curves coincide from the evaluated 2% budget onward. Line segments join evaluations at one-percentage-point
      budget intervals. The separate group-style legend applies to panel c only.


      The common domain contains 46,688 one-bridge/one-source-road conditional units across all 47 prefectures,
      sharing 15,815 measured 2021 daytime 12-hour traffic observation units. The source bridge inventory retains
      all 730,844 records. The adopted anchor scenario retains a unique nearby candidate within 50 m with no alternative
      within nearest distance plus 5 m, and withholds class/level conflicts, tunnel-nearest, old-asset, source-quality
      and shared-nearest-feature cases. This is an assumed road association, not independently verified bridge identity
      or a complete physical bridge footprint. Condition categories and dimensions are observed heterogeneous latest
      inspection inputs; the candidate graph is from 2024 and baseline population/medical registration from 2020.


      Relative intervention cost equals bridge length times width. Budget share is the requested budget divided
      by total common-domain relative cost. Fixed ordered lists select their longest affordable complete prefix,
      retain indivisible units and may leave unused budget; the maximum unspent share across these evaluations is
      2.24% of total cost. These rules are priority policies rather than proven optimal allocations. Traffic priority
      ranks observed volume per cost; condition priority orders categories IV, III, II and I, then lower cost within
      category; access priority ranks lost-path population per cost, then additional distance burden per cost. Thus
      access priority explicitly targets the evaluated medical reachability outcome and is not an equity criterion
      by definition.


      Selecting a unit is assumed to prevent its own single-source-road loss event completely. Events are mutually
      exclusive and equally weighted. Protection is the selected units'' loss divided by the loss over all common-domain
      events, separately for each outcome or group. Repeated population across distinct events is not a count of
      unique beneficiaries. These are conditional single-event loss averages, not annual benefits, measured maintenance
      effects, real expenditure or a scenario closing all unselected roads simultaneously. Both outcomes retain
      fixed origin and destination entries and parallel road alternatives; disconnected origins receive no arbitrary
      finite distance penalty. Loss of a fixed origin entry is included in reachability loss and is not automatically
      downstream network isolation.


      Area groups use the upper quartile of the original 145,771 selected official publication supports, with all
      cutoff ties retained: ageing share at least 49.693% among known ages, and population-weighted baseline medical
      distance at least 3.924 km. They contain 3,156,959 and 1,997,997 originally selected residents, respectively,
      and overlap by 661,726 residents. These are area-composition labels, not identified individual older residents.
      Group loss is recomputed from affected origins on the unchanged 175,612-mesh, 125,874,788-resident baseline,
      and each group/complement sum reconciles to the accepted national road-loss total. Group shares have their
      own denominators and are not additive.


      Display: 190 x 160 mm; 600 dpi PNG; no figure title. Analytical decision: MILI-D-20261007-026; layout revision:
      MILI-D-20261007-027. This figure was accepted under MILI-D-20261007-028.'
    figureSuitableSection: 'Appendix C: Independent bridge comparison'
    analysisScript: src/analyses/figure_common_budget_maintenance_protection_and_distribution.py
