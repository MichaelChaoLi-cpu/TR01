  fig_ageing_population_concentration_and_candidate_medical_access:
    figureId: fig_ageing_population_concentration_and_candidate_medical_access
    figurePath: data/results/figures/Figure_ageing_population_concentration_and_candidate_medical_access.png
    figureCaption: Ageing Population Concentration And Candidate Medical Access
    figurePanelCount: 2
    figureNote: >-
      (a) Official-support population aged 65 or older among known ages versus
      population-weighted candidate medical distance; (b) population density versus the same
      distance. All 145,771 selected official publication supports enter each panel once.
      Hexagon colors count supports, using a shared logarithmic count scale. Density uses
      complete member-mesh areas, including water, and a logarithmic horizontal axis; distance
      uses square-root coordinates with original kilometer labels. Orange lines are separate
      unweighted linear fits in those display coordinates. Black notes report matching Pearson
      correlations and regression R-squared. Full-support age and density denominators differ
      from the finite-path population denominator for distance. Age counts are not
      redistributed to member meshes. These are unadjusted area-level associations, not causal
      effects or individual older-resident access.
    figureAim: Describe area-level age/access and population-density/access distributions using count-binned scatter
      displays, simple straight trends in the existing display coordinates and matching Pearson correlations, without
      assigning older residents to member meshes.
    figureExplanation: 'On 145,771 original supports, Pearson correlation is +0.367703 for percentage ageing versus
      square-root medical distance and −0.721186 for log10 density versus square-root medical distance; R-squared
      is 0.135206 and 0.520109. Both hexagon displays count every support once. Density uses full-support footprints
      including water; medical means use finite-path member population. Trends are unadjusted descriptive associations.
      Ageing, Population Concentration and Candidate Medical Access. (a) Official-support share of residents aged
      65 or older among residents with known ages versus population-weighted candidate medical-network distance.
      (b) Official-support population density versus the same medical-distance measure. Population concentration
      is operationalized here as resident intensity, not spatial clustering. Each panel counts all 145,771 selected
      official age publication supports once. Hexagons summarize overlapping observations in transformed display
      coordinates; brighter colours represent more statistical units, using a shared logarithmic count colour scale.
      The colour reports supports per display hexagon, rather than resident counts or a probability density per
      unit of the original axes. The two horizontal inputs have different units; counts belong to the respective
      bins, whose geometry is matched across panels. No additional population weighting is applied to the counts.
      Density is full-support population divided by the summed ellipsoidal areas of all complete original member
      meshes, including water within those footprints, in residents per square kilometre. Its horizontal axis is
      logarithmic. Both vertical axes use a square-root scale with original kilometre labels; this retains the full
      distance range and exact zero distances without trimming. Orange lines show separate unweighted ordinary least-squares
      fits with intercepts, estimated on all original support observations rather than bin centres. The predictor
      in panel a is ageing share in percentage points; in panel b it is log10 population density. The response in
      both fits and Pearson correlations is the square root of medical distance in kilometres, matching the plotted
      vertical coordinate. The figure reports Pearson r and simple-regression R-squared using these same coordinates.
      Predictions are plotted directly in display coordinates as straight trend lines, with black statistical notes.
      The axis tick labels retain original kilometres and residents per square kilometre; stored values are unchanged.
      There are 30 zero-distance supports; zero denotes the accepted candidate-graph metric, not verified co-location
      of residents and services. Medical distance is weighted by total member population among finite-path meshes
      within each support. It remains conditional on the population with a candidate path, whereas density and ageing
      retain original full-support denominators. Support-level age counts are not redistributed to member meshes,
      and the observations do not measure individual older-resident travel. The separate fits are unadjusted descriptive
      relationships; no smoothing, extra sampling, spatial-independence inference or causal interpretation is applied.
      Population and medical registrations refer to 2020; the candidate road configuration refers to 2024. Registered
      hospitals and general clinics do not establish current opening, public availability or capacity. The figure
      describes selected-support associations under the accepted undirected candidate-network scenario, not observed
      journey times or maintenance-policy effects. Sources: e-Stat census population and age publication groups;
      MLIT National Land Numerical Information medical facilities and road centre lines.'
