  table_reachability_protection_under_demographic_scenarios:
    tableId: table_reachability_protection_under_demographic_scenarios
    tablePath: data/results/tables/Table_reachability_protection_under_demographic_scenarios.xlsx
    tableCaption: Reachability Protection Under Demographic Scenarios
    tableAim: Report scenario-specific medical-reachability protection at a 1% requested bridge budget, retaining
      the matched population and fixed original area groups.
    tableExplanation: 'All 36 percentages are the original scenario-specific protection outcomes at a 1% requested
      bridge cost. Access aggregate protection changes from 99.82% at matched 2020 to 99.95% in 2050, but changing
      loss denominators prevent interpreting this as increasing absolute protected residents. Three groups overlap;
      127 unmatched origins with 278 census residents are excluded only from this demographic comparison. Reachability
      Protection Under Demographic Scenarios


      Each value is the percentage of scenario-specific potential lost-medical-path population protected across
      equally weighted, mutually exclusive single-road closure events. It is not the percentage of the total resident
      population protected. Values are stored without rounding and displayed to two decimal places.


      All rules use a requested budget of 1% of the total relative intervention cost across 46,688 conditional bridge-associated
      road units. Cost is proportional to bridge length times width; the budget is neither a facility-count share
      nor a monetary expenditure. Complete fixed-prefix selection can leave unused budget.


      The matched 2020 reference comprises 175,485 origins and 125,874,510 census residents. The 127 unmatched original
      origins and 278 residents are excluded only from the matched demographic comparison. Original census population
      is multiplied by the official mesh projected-to-2020-reference ratio for 2030, 2040 and 2050; genuine projected
      zeros remain zero.


      Original 2020 higher-ageing and baseline-distance-disadvantaged area membership stays fixed. Groups overlap
      and are not additive. The network, medical destinations, maintenance units, costs, full event prevention and
      event weighting remain fixed. Access priority is reranked for each population scenario; traffic and condition
      selections remain fixed.


      Protection denominators change with scenario population; changes in these percentages do not by themselves
      establish changes in absolute protected residents. These are conditional bridge outcomes, not pavement sensitivity,
      future elderly-resident locations, observed repair effects, annual failure risks or optimal allocations. Access
      priority directly targets the reachability-loss outcome used in evaluation.


      This table replaces the former panel b of Priority Stability Under Budget and Demographic Scenarios. All 36
      source values are retained; no new model is estimated.'
    tableSuitableSection: 'Appendix C: Independent bridge comparison'
