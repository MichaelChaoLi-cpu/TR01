  table_protection_by_maintenance_rule_and_population_group:
    tableId: table_protection_by_maintenance_rule_and_population_group
    tablePath: data/results/tables/Table_protection_by_maintenance_rule_and_population_group.xlsx
    tableCaption: Protection By Maintenance Rule And Population Group
    tableAim: Compare aggregate and area-group conditional protection at common requested relative budgets.
    tableExplanation: 'At a requested 1% bridge budget, traffic, condition and access protect 27.47%, 11.09% and
      99.82% of lost-path population, respectively. Access distance-burden protection is 7.13%, while its actual
      spending is 0.9448146% of total relative cost; the complete prefix leaves resources unused. Group columns
      report reachability protection, not elderly individuals or finite-route distance protection. Protection by
      Maintenance Rule and Population Group


      Each requested budget compares the same three fixed priority rules on 46,688 conditional bridge-associated
      road units. Budget and spending percentages use total common-domain relative cost; protection percentages
      use the respective aggregate or group loss denominator.


      The two area columns report reachability protection for all selected residents in higher-ageing and baseline-distance-disadvantaged
      areas. These overlapping groups are defined on original publication supports; they are not individual older-resident
      outcomes.


      Maintenance fully prevents a selected unit''s own event under equally weighted, mutually exclusive single-road
      events. Cost is bridge length times width. Fixed-prefix selection does not skip or split an unaffordable unit;
      actual and unused spending can differ among rules.


      Protection is conditional on the adopted sample and assumptions. Access priority directly targets evaluated
      reachability loss; its performance alone does not establish optimality or equity. No annual risk, unique-beneficiary
      or spatial demographic-change estimate is reported.


      Workbook cells retain unrounded fractions. Protection is displayed to two percentage decimals; actual and
      unused spending to four. Display rounding does not modify source values.'
    tableSuitableSection: 'Appendix C: Independent bridge comparison'
    analysisScript: src/analyses/table_protection_by_maintenance_rule_and_population_group.py
