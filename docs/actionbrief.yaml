    figurePath: data/results/figures/Figure_pavement_maintenance_protection_under_budget_constraints.png
    figureCaption: Pavement Maintenance Protection Under Budget Constraints
    figurePanelCount: 4
    figureNote: >-
      (a-c) Protection for all selected residents, higher-aging areas and
      baseline-distance-disadvantaged areas at requested budgets of 1%, 5%, 10% and 20%, under
      the 25% unmaintained-road impedance increment; (d) aggregate protection at a 1% budget
