      impedance sensitivity at a 1% requested budget.
    figureExplanation: 'At 1% of the independent 70,049-road length cost, access protects 25.66% overall, 5.54%
      in higher-ageing areas and 8.11% in distance-disadvantaged areas. Traffic and condition protect 1.25% and
      1.25% overall. Different eligibility, scores, costs and references prevent treating these values as the national
      replacement or a direct empirical validation of its effect sizes. # Pavement Maintenance Protection Under
      Budget Constraints


      Panels a-c compare aggregate, higher-ageing-area and baseline-distance-disadvantaged-area protection at requested
      budgets of 1, 5, 10 and 20 percent, under a 25 percent unmaintained-road impedance increment. Panel d compares
      aggregate protection at a 1 percent budget under 10, 25 and 50 percent increments, keeping the baseline priority
      lists and selections fixed. Protection is the fraction of population-weighted excess generalized medical-access
      cost avoided relative to the same group''s all-unmaintained reference. Group denominators differ and the two
      area groups overlap. Lines connect evaluated budget points without adding intermediate evaluations. Results
      concern 70,049 conditional pavement units on a fixed national network and selected population, with length-relative
      costs and assumed finite impairment; they are not observed repair effects, travel-time savings or individual
